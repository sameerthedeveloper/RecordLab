<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline — Record Lab</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf7f0;color:#1c2b33;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
    main{max-width:26rem}
    img{width:84px;height:84px;border-radius:22px;box-shadow:0 14px 30px -14px rgba(28,43,51,.5)}
    h1{font:700 2rem/1.1 Georgia,serif;margin:20px 0 8px;letter-spacing:-.02em}
    p{color:#4b5a63;line-height:1.55;margin:0 0 22px}
    button{background:#c2410c;color:#fff;border:0;border-radius:999px;padding:13px 26px;font:600 15px system-ui;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Record Lab couldn't reach the network. Pages you've already opened still work. Reconnect to sync your account and cloud files.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
